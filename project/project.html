<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Flipkart</div>
    <input type="text" placeholder="Search for products, brands and more">
    <button class="login">Login</button>
</header>

<section class="categories">
    <div>Mobiles</div>
    <div>Fashion</div>
    <div>Electronics</div>
    <div>Home</div>
    <div>Appliances</div>
</section>

<section class="products">
    <div class="card">
        <img src="mobile.jpg" alt="Mobile">
        <h3>Smartphone</h3>
        <p>₹12,999</p>
    </div>

    <div class="card">
        <img src="laptop.jpg" alt="Laptop">
        <h3>Laptop</h3>
        <p>₹49,999</p>
    </div>

    <div class="card">
        <img src="headphone.jpg" alt="Headphone">
        <h3>Headphones</h3>
        <p>₹1,999</p>
    </div>

    <div class="card">
        <img src="tv.jpeg" alt="TV">
        <h3>Smart TV</h3>
        <p>₹32,999</p>
    </div>

    <div class="card">
        <img src="shoe.jpeg" alt="Shoes">
        <h3>Running Shoes</h3>
        <p>₹2,499</p>
    </div>

    <div class="card">
        <img src="fridge.jpeg" alt="Fridge">
        <h3>Refrigerator</h3>
        <p>₹18,999</p>
    </div>
</section>

</body>
</html>
